services:
  ray-head:
    image: rayproject/ray:2.59.0-py311-aarch64
    hostname: ray-head
    command: >
      ray start --head --port=6379
      --dashboard-host=0.0.0.0
      --num-cpus=0
      --object-store-memory=500000000
      --block
    ports:
      - "8265:8265"
    shm_size: 1gb
    volumes:
      - /home/aakash/data:/data
      - ../results:/results
      - ..:/workspace
    networks: [raynet]

  ray-worker-1:
    image: rayproject/ray:2.59.0-py311-aarch64
    hostname: ray-worker-1
    command: >
      ray start --address=ray-head:6379
      --num-cpus=2
      --object-store-memory=1000000000
      --block
    cpus: 2
    mem_limit: 4g
    shm_size: 1200mb
    depends_on: [ray-head]
    volumes:
      - /home/aakash/data:/data
      - ../results:/results
    networks: [raynet]

  ray-worker-2:
    image: rayproject/ray:2.59.0-py311-aarch64
    hostname: ray-worker-2
    command: >
      ray start --address=ray-head:6379
      --num-cpus=2
      --object-store-memory=1000000000
      --block
    cpus: 2
    mem_limit: 4g
    shm_size: 1200mb
    depends_on: [ray-head]
    volumes:
      - /home/aakash/data:/data
      - ../results:/results
    networks: [raynet]

networks:
  raynet:
